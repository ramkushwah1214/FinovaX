services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: finovax-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - ADMIN_API_KEY=${ADMIN_API_KEY:-finovax_ai_admin_secret_key_2026}
    volumes:
      - finovax-ai-corrections:/app/data/corrections
    networks:
      - finovax-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finovax-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - finovax-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finovax-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finovax-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  finovax-ai-corrections:
    name: finovax-ai-corrections

networks:
  finovax-network:
    name: finovax-network
    driver: bridge

